:root{font-family:Segoe UI,Arial,sans-serif;color:#eaf9f6;background:#071c2b}*{box-sizing:border-box}body{margin:0;overflow:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation}#app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 75% 20%,#195b68 0%,transparent 46%),linear-gradient(130deg,#061926,#10394b 65%,#09242f)}header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#061b28ba;border-bottom:1px solid #ffffff25;gap:12px}header strong{font-size:clamp(15px,1.8vw,24px)}.controls{display:flex;gap:8px}.btn{border:1px solid #8edacb66;border-radius:12px;padding:12px 18px;background:#174958;color:white;font-weight:700;min-height:48px}.btn:hover,.btn:focus-visible{background:#237b83}.primary{background:#e8b65b;color:#152631;border-color:#ffdc90}.primary:hover{background:#ffd083}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:2vh 3vw;overflow:auto}.panel{width:min(1120px,100%);max-height:100%;overflow:auto;background:#092b3cd9;border:1px solid #76d4c754;border-radius:24px;padding:clamp(16px,2vw,28px);box-shadow:0 22px 70px #0006}.eyebrow{color:#91e3d0;font-weight:800;letter-spacing:.13em;text-transform:uppercase;font-size:13px}h1{font-size:clamp(30px,5vw,65px);line-height:1.04;margin:12px 0}h2{font-size:clamp(23px,3vw,36px);margin:8px 0 14px}p{line-height:1.5;font-size:clamp(15px,1.6vw,21px)}.muted{color:#b4d2d6}.missionGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.mission{min-height:125px;text-align:left;padding:18px;border-radius:17px;background:#174554;border:1px solid #69c7b45a;color:#fff}.mission b{display:block;font-size:19px;margin:10px 0}.mission small{color:#c3dfe0}.mission.done{border-color:#e8b65b;background:#315747}.game{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:stretch}.scene{border-radius:18px;min-height:280px;background:linear-gradient(#3287a5,#b3d9c7 62%,#286858 62%);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px}.scene::before{content:'☀';position:absolute;top:12px;right:22px;font-size:55px;color:#ffe9a1;animation:pulse 3s infinite}.scene .symbol{font-size:clamp(70px,10vw,140px);filter:drop-shadow(0 12px 12px #0004);animation:float 4s ease-in-out infinite}.scene .label{font-size:23px;font-weight:800;text-align:center;text-shadow:0 2px 6px #0008}.scene[data-theme="soil"]{background:linear-gradient(#518d79 0 25%,#795339 25% 70%,#4b3028 70%)}.scene[data-theme="carbon"]{background:linear-gradient(#327b93,#2d7456)}.scene[data-theme="food"]{background:linear-gradient(#72a4ad,#51874e)}.scene[data-theme="impact"]{background:linear-gradient(120deg,#b9a273,#536b54)}.options{display:grid;gap:10px;margin:18px 0}.option{padding:15px 18px;min-height:58px;border-radius:12px;border:1px solid #81c6c073;background:#1a4c5c;color:white;text-align:left;font-weight:650;font-size:clamp(15px,1.45vw,19px)}.option.selected{background:#a8e2cb;color:#103541}.option:disabled{opacity:.75}.feedback{padding:13px 16px;border-radius:12px;background:#163e49;border-left:4px solid #f3c771;margin:10px 0;line-height:1.4}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.progress{height:8px;border-radius:20px;background:#234b57;overflow:hidden;margin-top:10px}.progress span{display:block;height:100%;background:#f0bd69;transition:width .4s}.stat{color:#b6dfda;font-size:15px}.range{width:100%;accent-color:#f0bd69;min-height:36px}.reading{background:#123e4d;border-radius:12px;padding:12px;margin-top:12px}.hide{display:none!important}@keyframes float{50%{transform:translateY(-12px)}}@keyframes pulse{50%{opacity:.65;transform:scale(1.08)}}@media(max-width:750px){header{padding:8px}.stage{padding:8px}.game{grid-template-columns:1fr}.scene{min-height:145px}.scene .symbol{font-size:60px}.missionGrid{grid-template-columns:repeat(2,1fr)}.panel{padding:12px}.mission{min-height:100px;padding:10px}p{font-size:15px}}

/* Иллюстрированные игровые локации: локальные ресурсы, без подключения к сети */
#app{background:linear-gradient(90deg,#071927e8,#071927b0),url('hero.webp') center/cover no-repeat}
.panel{background:linear-gradient(130deg,#092b3cf2,#092b3cdb);backdrop-filter:blur(5px)}
.scene{background-position:center!important;background-size:cover!important;isolation:isolate;border:2px solid #d2f9e875;box-shadow:inset 0 0 70px #00192380}
.scene::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#061c2830,#061c2855 50%,#061c28d9);z-index:-1}
.scene::before{display:none}
.scene[data-theme="water"]{background-image:url('water.webp')!important}
.scene[data-theme="carbon"]{background-image:url('carbon.webp')!important}
.scene[data-theme="soil"]{background-image:url('soil.webp')!important}
.scene[data-theme="food"]{background-image:url('food.webp')!important}
.scene[data-theme="impact"]{background-image:url('impact.webp')!important}
.scene[data-theme="balance"]{background-image:url('balance.webp')!important}
.scene .symbol{font-size:clamp(55px,7vw,100px);text-shadow:0 7px 24px #03121a;animation:float 4s ease-in-out infinite}
.scene .label{background:#052532b8;padding:12px 18px;border-radius:16px}
.mission{background:linear-gradient(125deg,#164454ed,#0d2d3ac9),url('hero.webp') center/cover;transition:transform .18s,border-color .18s}
.mission:hover{transform:translateY(-3px);border-color:#f7d68a}
@media (min-width:900px){.scene{min-height:430px}}

/* Animated nature layers: self-contained and offline */
.scene{transform:translateZ(0);background-size:110% 110%!important;animation:landscapeDrift 18s ease-in-out infinite alternate}
.scene .symbol{position:relative;z-index:4;animation:float 3.6s ease-in-out infinite,softGlow 4s ease-in-out infinite}
.scene .label,.scene .scene-note{position:relative;z-index:5}
.scene .scene-note{font-size:clamp(12px,1.1vw,16px);text-align:center;background:#082c3bd9;padding:9px 13px;border-radius:12px;margin-top:18px}
.fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.fx span{position:absolute;display:block}
.fx-cloud{width:110px;height:35px;border-radius:60px;background:#fff9;filter:blur(3px);top:14%;left:-35%;animation:cloudPass 16s linear infinite}
.fx-cloud:before,.fx-cloud:after{content:'';position:absolute;background:inherit;border-radius:50%}.fx-cloud:before{width:52px;height:52px;left:17px;bottom:9px}.fx-cloud:after{width:67px;height:56px;left:45px;bottom:2px}
.fx-cloud.c2{top:28%;animation-delay:-9s;animation-duration:22s;transform:scale(.65);opacity:.7}
.fx-drop{width:3px;height:18px;background:linear-gradient(#b8faff00,#b8faffc9);border-radius:100%;top:-25px;animation:rainfall 1.25s linear infinite;opacity:.75}
.fx-spark{width:6px;height:6px;background:#fff2aa;border-radius:50%;box-shadow:0 0 13px #f9e993;animation:sparkle 4s ease-in-out infinite}
.fx-leaf{width:13px;height:8px;border-radius:100% 0 100% 0;background:#e8b35d;animation:leafFall 8s linear infinite}
.fx-ripple{width:30px;height:9px;border:2px solid #c3ffffa8;border-radius:50%;bottom:17%;left:30%;animation:ripple 3.5s ease-out infinite}
.fx-ripple.r2{left:62%;bottom:24%;animation-delay:-1.6s}
.fx-mist{width:140%;height:36%;bottom:-14%;left:-20%;border-radius:50%;background:#c3e9e32c;filter:blur(25px);animation:mistMove 9s ease-in-out infinite alternate}
.fx[data-kind=impact] .fx-mist{background:#e2ac6d33}
@keyframes landscapeDrift{from{background-position:46% 50%}to{background-position:54% 50%}}
@keyframes cloudPass{to{left:115%}}
@keyframes rainfall{to{transform:translate(-22px,520px)}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:.95;transform:scale(1.3)}}
@keyframes leafFall{to{transform:translate(110px,460px) rotate(550deg);opacity:0}}
@keyframes ripple{from{transform:scale(.4);opacity:1}to{transform:scale(3);opacity:0}}
@keyframes mistMove{to{transform:translateX(12%)}}
@keyframes softGlow{50%{filter:drop-shadow(0 0 18px #c6f5ed)}}
@media(prefers-reduced-motion:reduce){.scene,.scene .symbol,.fx span{animation:none!important}}
@media(max-height:750px){.scene{min-height:250px!important}.panel{padding:14px}.missionGrid{margin:12px 0}.mission{min-height:95px}}

'use strict';function natureEffects(theme){let bits='<div class="fx" data-kind="'+theme+'" aria-hidden="true">';if(theme==='water'){bits+='<span class="fx-cloud"></span><span class="fx-cloud c2"></span>';for(let i=0;i<24;i++)bits+='<span class="fx-drop" style="left:'+(5+i*4)+'%;animation-delay:-'+(i*.17).toFixed(2)+'s;animation-duration:'+(1+i%4*.12)+'s"></span>';bits+='<span class="fx-ripple"></span><span class="fx-ripple r2"></span>'}else if(theme==='soil'||theme==='carbon'||theme==='food'){for(let i=0;i<15;i++)bits+='<span class="'+(theme==='soil'?'fx-leaf':'fx-spark')+'" style="left:'+(i*7%95)+'%;top:'+(i*19%75)+'%;animation-delay:-'+(i*.57).toFixed(2)+'s"></span>'}else{bits+='<span class="fx-mist"></span>';for(let i=0;i<12;i++)bits+='<span class="fx-spark" style="left:'+(i*13%95)+'%;top:'+(i*23%80)+'%;animation-delay:-'+(i*.43).toFixed(2)+'s"></span>'}return bits+'</div>'}
const stage=document.getElementById('stage');const missions=[
{title:'Исчезающая вода',short:'Круговорот воды',theme:'water',symbol:'💧',intro:'В долине обмелело озеро. Исследуйте путь воды и объясните, что влияет на испарение.',experiment:{name:'Температура воздуха',unit:'°C',min:5,max:35,initial:15,read:v=>`При ${v} °C в нашей условной модели относительная интенсивность испарения: ${Math.round(v/35*100)}%. При прочих равных более высокая температура обычно ускоряет испарение.`},q:'Какой процесс превращает водяной пар в мельчайшие капли облака?',answers:['Конденсация','Просачивание','Поверхностный сток'],correct:0,why:'При охлаждении водяной пар конденсируется на частицах в воздухе, образуя капельки воды.'},
{title:'Невидимый углерод',short:'Круговорот углерода',theme:'carbon',symbol:'🌳',intro:'Датчик станции обнаружил изменение содержания CO₂. Определите, как углерод перемещается между живыми организмами и атмосферой.',experiment:{name:'Интенсивность освещения',unit:'%',min:0,max:100,initial:40,read:v=>`Условная скорость фотосинтеза: ${Math.round(Math.min(v,75)/75*100)}%. При наличии воды и CO₂ свет обычно повышает скорость фотосинтеза до насыщения.`},q:'Какой процесс переносит углерод из атмосферного CO₂ в органические вещества растений?',answers:['Фотосинтез','Испарение','Эрозия'],correct:0,why:'Во время фотосинтеза растения используют углекислый газ для образования органических веществ.'},
{title:'Подземная лаборатория',short:'Круговорот веществ',theme:'soil',symbol:'🍂',intro:'В почве накапливаются опавшие листья. Узнайте, кто помогает возвращать питательные вещества в круговорот.',experiment:{name:'Влажность почвы',unit:'%',min:0,max:100,initial:30,read:v=>`Условная активность разложения: ${Math.round(Math.max(0,100-Math.abs(v-60)*2.1))}%. Недостаток влаги тормозит работу многих разрушителей, а переувлажнение может ограничивать кислород.`},q:'Кто играет важную роль в разложении отмерших остатков?',answers:['Грибы и бактерии','Только травоядные','Только солнечный свет'],correct:0,why:'Грибы и бактерии разлагают органические остатки; почвенные животные также помогают измельчать и перерабатывать их.'},
{title:'Нарушенная цепь',short:'Пищевые связи',theme:'food',symbol:'🦊',intro:'В лесу резко уменьшилась численность зайцев. Оцените возможные последствия для пищевой сети.',experiment:{name:'Численность зайцев (условно)',unit:'',min:0,max:100,initial:70,read:v=>`Популяция зайцев: ${v} условных единиц. При уменьшении численности зайцев у хищников, питающихся ими, может сократиться доступность пищи; результат зависит и от других видов добычи.`},q:'Какое утверждение научно верно?',answers:['Вещества участвуют в круговороте, а энергия проходит через пищевую сеть и рассеивается в виде тепла','Энергия бесконечно движется по замкнутому кругу','Все хищники питаются только одним видом'],correct:0,why:'Вещества могут многократно использоваться в экосистеме; энергия поступает преимущественно от Солнца и постепенно рассеивается.'},
{title:'Экосистема под угрозой',short:'Влияние человека',theme:'impact',symbol:'🏞️',intro:'После вырубки деревьев почва на склоне стала сильнее размываться. Выберите научно обоснованную меру.',experiment:{name:'Растительный покров',unit:'%',min:0,max:100,initial:30,read:v=>`Условный риск эрозии: ${100-v} из 100. Корни и растительный покров часто уменьшают смыв почвы, хотя на реальную эрозию влияют также склон, осадки и тип грунта.`},q:'Что наиболее прямо помогает снизить эрозию на оголённом склоне?',answers:['Восстановить устойчивый растительный покров','Удалить оставшиеся корни','Увеличить движение техники по склону'],correct:0,why:'Растительность защищает почву от ударов капель и стока воды, а корни помогают удерживать её.'},
{title:'Код равновесия',short:'Итоговая миссия',theme:'carbon',symbol:'🌍',intro:'Объедините знания. Станции нужно выбрать решение, поддерживающее работу водного и биологического круговоротов.',experiment:{name:'Доля восстановленного леса',unit:'%',min:0,max:100,initial:20,read:v=>`Восстановлено ${v}% условной площади леса. Это может улучшать удержание почвы, среду обитания и участие растений в обмене воды и углерода, но последствия зависят от местных условий.`},q:'Какое решение учитывает сразу несколько природных связей?',answers:['Восстановить местные растения, защитить почву и уменьшить загрязнение воды','Считать, что растения не влияют на круговороты','Убрать разрушителей из почвы'],correct:0,why:'Комплексные меры учитывают связь воды, почвы, растений, животных и микроорганизмов.'}
];let state={done:[],score:0,active:0,step:0,choice:null,checked:false,reading:0};try{const saved=JSON.parse(localStorage.getItem('nature-cycle-progress')||'null');if(saved&&Array.isArray(saved.done)){state.done=saved.done.filter(x=>Number.isInteger(x)&&x>=0&&x<6);state.score=Number(saved.score)||0}}catch(e){}const save=()=>{try{localStorage.setItem('nature-cycle-progress',JSON.stringify({done:state.done,score:state.score}))}catch(e){}};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function menu(){stage.innerHTML=`<section class="panel"><div class="eyebrow">Научная экспедиция • 5–6 классы</div><h1>Тайны круговорота природы</h1><h2 style="color:#f3c879">Код равновесия</h2><p>Шесть исследовательских миссий. Экспериментируйте, проверяйте гипотезы и объясняйте, как связаны природные процессы.</p><div class="stat">Выполнено: ${state.done.length}/6 · Верных ответов с первой попытки: ${state.score}</div><div class="progress"><span style="width:${state.done.length/6*100}%"></span></div><div class="missionGrid">${missions.map((m,i)=>`<button class="mission ${state.done.includes(i)?'done':''}" data-m="${i}"><span>${state.done.includes(i)?'✓':'0'+(i+1)}</span><b>${esc(m.title)}</b><small>${esc(m.short)}</small></button>`).join('')}</div><div class="row"><button class="btn primary" id="start">${state.done.length===6?'Повторить экспедицию':'Начать / продолжить'}</button><button class="btn" id="reset">Сбросить результаты</button></div></section>`;stage.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>openMission(+b.dataset.m));document.getElementById('start').onclick=()=>openMission(missions.findIndex((_,i)=>!state.done.includes(i))<0?0:missions.findIndex((_,i)=>!state.done.includes(i)));document.getElementById('reset').onclick=()=>{if(confirm('Сбросить прогресс всех миссий?')){state.done=[];state.score=0;save();menu()}}}function openMission(i){state.active=i;state.step=0;state.choice=null;state.checked=false;state.reading=missions[i].experiment.initial;renderMission()}function renderMission(){const m=missions[state.active],e=m.experiment;let content='';if(state.step===0){content=`<div class="eyebrow">Миссия ${state.active+1} из 6</div><h2>${esc(m.title)}</h2><p>${esc(m.intro)}</p><p class="muted">Задача: исследуйте модель, затем ответьте на вопрос и объясните решение классу.</p><button class="btn primary" id="next">Начать исследование →</button>`}else if(state.step===1){content=`<div class="eyebrow">Этап 1 · Виртуальный эксперимент</div><h2>${esc(m.title)}</h2><p>Измените параметр и сравните результаты при низком и высоком значении.</p><label for="param"><b>${esc(e.name)}: <span id="value">${state.reading}</span> ${esc(e.unit)}</b></label><input class="range" id="param" type="range" min="${e.min}" max="${e.max}" value="${state.reading}"><div class="reading" id="result">${esc(e.read(state.reading))}</div><p class="muted">Обсудите: что изменилось и какие факторы модель не учитывает?</p><button class="btn primary" id="next">Перейти к научной задаче →</button>`}else if(state.step===2){content=`<div class="eyebrow">Этап 2 · Научная задача</div><h2>${esc(m.title)}</h2><p>${esc(m.q)}</p><div class="options">${m.answers.map((a,i)=>`<button class="option ${state.choice===i?'selected':''}" data-a="${i}" ${state.checked?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}</div>${state.checked?`<div class="feedback"><b>${state.choice===m.correct?'Верно!':'Разберём ответ.'}</b> ${esc(m.why)}</div>`:''}<div class="row">${!state.checked?'<button class="btn primary" id="check">Проверить решение</button>':'<button class="btn primary" id="next">Завершить миссию →</button>'}</div>`}else{content=`<div class="eyebrow">Миссия завершена</div><h2>Исследование выполнено ✓</h2><p>${esc(m.why)}</p><p>Обсудите с классом: где в природе можно наблюдать этот процесс?</p><div class="row"><button class="btn primary" id="next">${state.active===5?'Посмотреть итог':'Следующая миссия →'}</button><button class="btn" id="backmenu">К карте миссий</button></div>`}stage.innerHTML=`<section class="panel"><div class="game"><div class="scene" data-theme="${m.theme}">${natureEffects(m.theme)}<div class="symbol">${m.symbol}</div><div class="label">${esc(m.short)}</div><div class="scene-note">${state.step===1?'Наблюдайте за показателями':state.step===2?'Обоснуйте свой ответ':'Экспедиция «Биосфера»'}</div></div><div>${content}</div></div><div class="progress"><span style="width:${(state.step+1)/4*100}%"></span></div></section>`;const next=document.getElementById('next');if(next)next.onclick=()=>{if(state.step===3){if(state.active===5){summary()}else openMission(state.active+1)}else{state.step++;renderMission()}};const param=document.getElementById('param');if(param)param.oninput=()=>{state.reading=+param.value;document.getElementById('value').textContent=state.reading;document.getElementById('result').textContent=e.read(state.reading)};stage.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{state.choice=+b.dataset.a;renderMission()});const check=document.getElementById('check');if(check)check.onclick=()=>{if(state.choice===null){alert('Сначала выберите ответ.');return}state.checked=true;if(state.choice===m.correct&&!state.done.includes(state.active))state.score++;if(!state.done.includes(state.active))state.done.push(state.active);save();renderMission()};const back=document.getElementById('backmenu');if(back)back.onclick=menu}function summary(){stage.innerHTML=`<section class="panel"><div class="eyebrow">Отчёт экспедиции</div><h1>Код равновесия восстановлен</h1><p>Исследовано миров: <b>${state.done.length} из 6</b>. Верных ответов с первой попытки: <b>${state.score} из 6</b>.</p><p>Главный вывод: вода и вещества участвуют в круговоротах, а живые организмы связаны обменом веществ и передачей энергии. Изменение одного компонента экосистемы может повлиять на другие.</p><p class="muted">Финальное обсуждение: какие три действия людей помогают сохранять природные связи?</p><button class="btn primary" id="back">К карте экспедиции</button></section>`;document.getElementById('back').onclick=menu}function teacher(){stage.innerHTML=`<section class="panel"><div class="eyebrow">Панель учителя</div><h2>Сценарий занятия · 45 минут</h2><p>Введение — 4 минуты; шесть миссий по 6 минут — 36 минут; итоговое обсуждение — 5 минут. Дайте ученикам возможность прогнозировать результат до изменения параметра.</p><div class="missionGrid">${missions.map((m,i)=>`<div class="mission" style="cursor:default"><b>${i+1}. ${esc(m.title)}</b><small>Ответ: ${esc(m.answers[m.correct])}<br>${esc(m.why)}</small></div>`).join('')}</div><p class="muted">Модели намеренно упрощены и показывают тенденции, а не точные измерения природных процессов.</p><button class="btn primary" id="back">Вернуться</button></section>`;document.getElementById('back').onclick=menu}document.getElementById('home').onclick=menu;document.getElementById('teacher').onclick=teacher;document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.().catch(()=>{})};menu();
</script></body></html>
